name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      # 'swift package audit' is not a real SwiftPM subcommand -- this step
      # previously always "passed" via `|| true` while actually erroring
      # ("Unknown subcommand or plugin name 'audit'") every run, silently.
      # Removed rather than left as false assurance. No replacement SCA step
      # needed: Package.swift declares zero external dependencies
      # (dependencies: []), so there is nothing to scan.

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  lint:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Check formatting
        run: |
          if which swiftformat >/dev/null; then
            swiftformat --lint .
          else
            echo "SwiftFormat not installed, skipping lint"
          fi
