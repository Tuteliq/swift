name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      # 'swift package audit' is not a real SwiftPM subcommand -- this step
      # previously always "passed" via `|| true` while actually erroring
      # ("Unknown subcommand or plugin name 'audit'") every run, silently.
      # Removed rather than left as false assurance. No replacement SCA step
      # needed: Package.swift declares zero external dependencies
      # (dependencies: []), so there is nothing to scan.

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

      # watchOS devices include 32-bit arm64_32, where Int is 32 bits: epoch
      # milliseconds must stay Int64. A generic device build covers that slice,
      # and build-for-testing compiles the test target too (its fixtures hold
      # millisecond literals that overflow Int there).
      - name: Build for watchOS
        run: xcodebuild build-for-testing -quiet -scheme Tuteliq -destination 'generic/platform=watchOS'

  lint:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      # Pinned so a new SwiftFormat release (and its new default rules) can't
      # turn CI red on unchanged code. Bump the version and checksum together.
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.64.0
          SWIFTFORMAT_SHA256: 95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          swiftformat --version
          swiftformat --lint .
